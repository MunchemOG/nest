<style>

}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.ui { position: fixed; inset: 0; pointer-events: none; padding-top: calc(env(safe-area-inset-top, 0px) + 28px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); }
.tag { position: absolute; left: 0; top: 0; text-align: center; pointer-events: auto; cursor: pointer; transition: opacity 500ms var(--ease); white-space: nowrap; display: grid; justify-items: center; gap: 6px; animation: fadein 900ms var(--ease) both; }
.tag { text-shadow: 0 1px 14px rgba(0, 0, 0, 0.75), 0 0 2px rgba(0, 0, 0, 0.5); }
.tag b { font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: -0.01em; color: var(--fg); transition: color 250ms ease; }
.tag .s { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--fg-3); transition: color 300ms ease; }
.tag .d { font-variant-numeric: tabular-nums; }
.tag .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--fg-3); flex: none; transition: background 300ms ease; }
.tag.working .dot { background: var(--c); animation: pulse 1.8s ease-in-out infinite; }
.tag.live .s { color: var(--fg); }
.tag.paused .s { color: var(--warn); }
.tag.paused .dot { background: var(--warn); }

.tag.asleep b { color: var(--fg-2); }
.tag.asleep .s { color: var(--fg-3); }
.tag:hover b { color: #fff; }
.tags.dim .tag { opacity: 0; pointer-events: none; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(10px); } }
@keyframes fadein { from { opacity: 0; filter: blur(6px); } }
.ui { position: fixed; inset: 0; pointer-events: none; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; border-radius: 6px; }

// ── each bird is its app icon made solid: a glossy tile in its colour, the glyph floating just in front in black enamel
// The glyph is drawn exactly as the official SVG, then traced into one clean outline, so crossing strokes fuse instead of overlapping.

    const a = v(x, y) > T, b = v(x + 1, y) > T, c = v(x + 1, y + 1) > T, d = v(x, y + 1) > T;
    const top = () => cross(x, y, 1), right = () => cross(x + 1, y, 0), bottom = () => cross(x, y + 1, 1), left = () => cross(x, y, 0);

      case 4: seg(right, top); break; case 6: seg(bottom, top); break; case 7: seg(left, top); break;
      case 8: seg(top, left); break; case 9: seg(top, bottom); break; case 11: seg(top, right); break;

const GREY = lin("#55555a"), SC = 0.5, GLYPH_DARK = lin("#0e0e10");
function fadeReflection(sh) {
