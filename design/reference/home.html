<title>Nest Flock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: the six birds stand in a dark studio as physical objects, like a car on its screen.
   Overview: one big sentence top-left, the birds centre stage, one command bar at the bottom.
   Click a bird: the camera glides to it and its controls appear beside it in large, quiet type. */
:root {
  color-scheme: dark;
  --bg: #0e0e10;
  --fg: #f2f1ee;
  --fg-2: rgba(242, 241, 238, 0.62);
  --fg-3: rgba(242, 241, 238, 0.5);
  --line: rgba(242, 241, 238, 0.12);
  --raise: rgba(28, 28, 31, 0.86);
  --clay: #cb6d4d;
  --warn: #e7b04b;
  --display: "Inter Tight", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --text: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
::selection { background: rgba(203, 109, 77, 0.38); color: var(--fg); }
input { caret-color: var(--clay); }

#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.ui { position: fixed; inset: 0; pointer-events: none; padding-top: calc(env(safe-area-inset-top, 0px) + 28px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); }
.ui > * { pointer-events: auto; }

/* top */
.top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 28px); left: 112px; right: max(40px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brief { max-width: min(760px, 52vw); display: grid; gap: 16px; transition: opacity 500ms var(--ease), transform 600ms var(--ease); }
.brief.away { opacity: 0; transform: translateY(-8px); pointer-events: none; }
/* headline: one statement set large, one quieter line beneath it */
.headline { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(34px, 3.7vw, 60px); line-height: 1.02; letter-spacing: -0.038em; text-wrap: balance; max-width: 13.5em; }
.headline .bn { color: color-mix(in srgb, var(--c) 62%, #ffffff); }
.headline .w { display: inline-block; }
.headline.anim .w { animation: wordin 900ms var(--ease) both; animation-delay: calc(var(--i) * 45ms); }
@keyframes wordin { from { opacity: 0; filter: blur(10px); transform: translateY(0.22em); } }
.sub { margin: 0; font-size: clamp(16px, 1.3vw, 19px); line-height: 1.45; letter-spacing: -0.008em; color: var(--fg-2); max-width: 32em; text-wrap: pretty; transition: opacity 500ms var(--ease); }
.sub .att { color: #e4a58c; font: inherit; font-weight: 500; display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; transition: color 200ms ease; }
.sub .att:hover { color: #f0bfaa; }
.sub .att svg { width: 12px; height: 12px; transform: translateY(1px); transition: transform 300ms var(--ease); }
.sub .att:hover svg { transform: translate(3px, 1px); }
.meta { display: flex; align-items: center; gap: 20px; }
.when { font-size: 13px; color: var(--fg-3); white-space: nowrap; }
.when b { font-weight: 500; color: var(--fg-2); margin-left: 6px; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; font-weight: 500; transition: background 200ms ease, border-color 200ms ease; white-space: nowrap; }
.pill:hover { background: rgba(242, 241, 238, 0.06); border-color: rgba(242, 241, 238, 0.22); }
.pill .n { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 999px; background: var(--clay); color: #0c0c0d; font-size: 12px; font-weight: 600; padding: 0 6px; }

/* bird labels (positioned from 3D) */
.tag { position: absolute; left: 0; top: 0; text-align: center; pointer-events: auto; cursor: pointer; transition: opacity 500ms var(--ease); white-space: nowrap; display: grid; justify-items: center; gap: 6px; animation: fadein 900ms var(--ease) both; }
.tag { text-shadow: 0 1px 14px rgba(0, 0, 0, 0.75), 0 0 2px rgba(0, 0, 0, 0.5); }
.tag b { font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: -0.01em; color: var(--fg); transition: color 250ms ease; }
.tag .s { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--fg-3); transition: color 300ms ease; }
.tag .d { font-variant-numeric: tabular-nums; }
.tag .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--fg-3); flex: none; transition: background 300ms ease; }
.tag.working .dot { background: var(--c); animation: pulse 1.8s ease-in-out infinite; }
.tag.live .s { color: var(--fg); }
.tag.paused .s { color: var(--warn); }
.tag.paused .dot { background: var(--warn); }
.tag:hover b { color: #fff; }
.tags.dim .tag { opacity: 0; pointer-events: none; }
@keyframes pulse { 50% { opacity: 0.3; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(10px); } }
@keyframes fadein { from { opacity: 0; filter: blur(6px); } }
.brief { animation: rise 1200ms var(--ease) 350ms both; }
.meta, .dock .cmd, .suggest, .keys { animation: fadein 1000ms var(--ease) 1500ms both; }

/* focus panel */
.focus { position: absolute; left: 112px; top: 50%; transform: translateY(-46%); width: min(430px, 36vw); display: grid; gap: 28px; transition: opacity 500ms var(--ease), transform 700ms var(--ease); }
.focus.away { opacity: 0; transform: translate(-16px, -46%); filter: blur(6px); pointer-events: none; }
.focus { filter: blur(0); }
.f-head { display: grid; gap: 10px; }
.back { justify-self: start; font-size: 13px; color: var(--fg-3); display: inline-flex; gap: 8px; align-items: center; }
.back:hover { color: var(--fg); }
.f-name { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(56px, 7vw, 104px); line-height: 0.92; letter-spacing: -0.045em; }
.f-role { font-size: 14px; color: var(--fg-3); }
.f-doing { margin: 0; font-family: var(--display); font-size: clamp(19px, 1.7vw, 24px); line-height: 1.3; letter-spacing: -0.015em; text-wrap: balance; }
.f-prog { display: grid; gap: 10px; }
.f-pct { font-family: var(--display); font-weight: 500; font-size: 64px; line-height: 0.9; letter-spacing: -0.04em; }
.f-pct small { font-size: 26px; color: var(--fg-3); margin-left: 2px; }
.f-track { height: 2px; background: var(--line); position: relative; overflow: hidden; }
.f-track i { position: absolute; inset: 0 auto 0 0; transition: width 300ms linear; }
.f-step { font-size: 13px; color: var(--fg-2); }
.f-recent { display: grid; }
.f-recent .r { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.f-recent .r:last-child { border-bottom: 1px solid var(--line); }
.f-recent .t { color: var(--fg-3); font-size: 12px; }
.f-recent .x { min-width: 0; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f-recent .r.undone .x { text-decoration: line-through; color: var(--fg-3); }
.f-recent button, .link { color: var(--fg); font-size: 13px; font-weight: 500; opacity: 0.75; }
.f-recent button:hover, .link:hover { opacity: 1; }
.f-acts { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { height: 40px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 500; border: 1px solid var(--line); transition: background 200ms ease, border-color 200ms ease; }
.btn:hover { background: rgba(242, 241, 238, 0.06); border-color: rgba(242, 241, 238, 0.24); }
.btn.solid { background: var(--fg); color: #0c0c0d; border-color: var(--fg); }
.btn.solid:hover { background: #ffffff; }

/* command bar + reply */
.dock { position: absolute; left: calc(50% + 66px); bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); transform: translateX(-50%); width: min(600px, calc(100% - 32px)); display: grid; gap: 12px; justify-items: center; }
.reply { min-height: 24px; font-size: 15px; text-align: center; color: var(--fg-2); transition: opacity 600ms var(--ease), transform 600ms var(--ease); text-wrap: balance; }
.reply b { font-weight: 500; margin-right: 8px; }
.reply svg { width: 18px; height: 18px; vertical-align: -4px; margin-right: 8px; }
.typing { display: inline-flex; gap: 4px; vertical-align: 2px; }
.typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--fg-2); animation: blink 1.1s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: 0.15s; } .typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.to { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; margin-left: -2px; border-radius: 999px; flex: none; background: color-mix(in srgb, var(--c, #f2f1ee) 16%, transparent); color: color-mix(in srgb, var(--c, #f2f1ee) 60%, white); font-size: 13.5px; font-weight: 500; white-space: nowrap; animation: fadein 300ms var(--ease); }
.to svg { display: none; }
.keys { position: absolute; left: max(40px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 50px); font-size: 12px; color: var(--fg-3); display: flex; gap: 18px; }
.keys kbd { font-family: var(--text); font-size: 11px; color: var(--fg-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; margin-right: 6px; }
.f-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: 13.5px; }
.f-steps li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; color: var(--fg-3); transition: color 300ms ease; }
.f-steps li.done { color: var(--fg-2); } .f-steps li.on { color: var(--fg); }
.f-steps .m { text-align: center; }
.f-steps .c { font-variant-numeric: tabular-nums; color: var(--fg-2); }
.f-eta { font-size: 13px; color: var(--fg-3); }
.f-pct-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.reply.gone { opacity: 0; transform: translateY(6px); }
/* command bar: a smoked-glass capsule; the six birds sit in it as a row of small jewels */
form.cmd { width: 100%; display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 9px 0 12px; border-radius: 999px; background: rgba(30, 30, 35, 0.6); border: 1px solid rgba(242, 241, 238, 0.1); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), inset 0 -1px 0 rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.35), 0 28px 60px -24px rgba(0, 0, 0, 0.85); -webkit-backdrop-filter: blur(28px) saturate(150%); backdrop-filter: blur(28px) saturate(150%); transition: border-color 300ms var(--ease), box-shadow 400ms var(--ease), transform 500ms var(--ease); }
form.cmd:focus-within { border-color: rgba(242, 241, 238, 0.2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), inset 0 -1px 0 rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.35), 0 34px 70px -24px rgba(0, 0, 0, 0.9); transform: translateY(-2px); }
.who { display: flex; gap: 1px; padding-right: 10px; border-right: 1px solid rgba(242, 241, 238, 0.09); flex: none; }
.who button { width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; opacity: 0.8; transition: opacity 250ms var(--ease), transform 400ms var(--ease), background 250ms var(--ease); }
.who button svg { width: 22px; height: 22px; border-radius: 6px; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.18) inset; }
.who button:hover { opacity: 1; transform: translateY(-2px); }
.who.picked button { opacity: 0.25; }
.who.picked button.on { opacity: 1; background: rgba(242, 241, 238, 0.09); }
.field { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; height: 100%; }
.field input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; font-size: 15.5px; letter-spacing: -0.005em; }
.ph { position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-size: 15.5px; letter-spacing: -0.005em; color: var(--fg-2); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; transition: opacity 260ms var(--ease), transform 420ms var(--ease), filter 260ms var(--ease); }
.ph.out { opacity: 0; transform: translateY(calc(-50% - 8px)); filter: blur(4px); }
.ph.pre { opacity: 0; transform: translateY(calc(-50% + 8px)); filter: blur(4px); transition: none; }
.field.typed .ph { opacity: 0; transition-duration: 80ms; }
.slash { font: 500 11px var(--text); color: var(--fg-3); border: 1px solid rgba(242, 241, 238, 0.12); border-radius: 6px; padding: 2px 7px; flex: none; transition: opacity 250ms var(--ease); }
form.cmd:focus-within .slash, form.cmd.has .slash { opacity: 0; }
.send { width: 40px; height: 40px; border-radius: 999px; background: rgba(242, 241, 238, 0.08); color: var(--fg-3); display: grid; place-items: center; flex: none; transition: background 300ms var(--ease), color 300ms var(--ease), transform 300ms var(--ease); }
form.cmd.has .send { background: var(--fg); color: #0c0c0d; }
.send:active { transform: scale(0.93); }
.send svg { width: 16px; height: 16px; }
.suggest { display: flex; gap: 4px; flex-wrap: nowrap; justify-content: center; transition: opacity 400ms ease; }
.suggest button { font-size: 12.5px; color: var(--fg-3); padding: 4px 10px; white-space: nowrap; border-radius: 999px; border: 1px solid transparent; }
.suggest button:hover { color: var(--fg); border-color: var(--line); }

/* glass: one material for every panel — smoked, blurred, with a lit top edge */
.glass { background: rgba(22, 22, 27, 0.56); border: 1px solid rgba(242, 241, 238, 0.08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 1px 2px rgba(0, 0, 0, 0.3), 0 24px 48px -20px rgba(0, 0, 0, 0.75); -webkit-backdrop-filter: blur(26px) saturate(160%); backdrop-filter: blur(26px) saturate(160%); }
.ico { width: 26px; height: 26px; border-radius: 8px; flex: none; display: block; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.18) inset, 0 4px 10px -4px rgba(0, 0, 0, 0.6); }
.eyeless { font-size: 12px; font-weight: 500; color: var(--fg-3); letter-spacing: 0.01em; }

/* rail */
.rail { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); display: grid; gap: 6px; padding: 10px; border-radius: 20px; animation: fadein 900ms var(--ease) 1300ms both; }
.rail .mark { width: 40px; height: 40px; border-radius: 12px; margin-bottom: 10px; }
.rail button { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--fg-3); transition: background 200ms ease, color 200ms ease; position: relative; }
.rail button svg { width: 19px; height: 19px; }
.rail button:hover { color: var(--fg); background: rgba(242, 241, 238, 0.06); }
.rail button.on { color: var(--fg); background: rgba(242, 241, 238, 0.1); }
.rail button.on::before { content: ""; position: absolute; left: -10px; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--clay); }
.rail .sep { height: 1px; background: rgba(242, 241, 238, 0.08); margin: 6px 4px; }

/* mode switch */
.modes { position: relative; display: flex; padding: 4px; border-radius: 999px; }
.modes button { white-space: nowrap; position: relative; z-index: 1; height: 30px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--fg-3); transition: color 250ms ease; display: inline-flex; align-items: center; gap: 7px; }
.modes button svg { width: 14px; height: 14px; }
.modes button.on { color: #0c0c0d; }
.modes .knob { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--fg); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }
.modes.ready .knob { transition: transform 500ms var(--ease), width 500ms var(--ease); }

/* right column */
.side { position: absolute; right: max(32px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 88px); width: 340px; display: grid; gap: 12px; transition: opacity 500ms var(--ease), transform 600ms var(--ease); animation: rise 1100ms var(--ease) 1200ms both; }
.widget { border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 16px; }
.ring { width: 56px; height: 56px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .t { position: absolute; inset: 0; display: grid; place-items: center; font: 600 13px var(--display); letter-spacing: -0.01em; }
.widget h3 { margin: 0; font: 500 15px var(--display); letter-spacing: -0.01em; }
.widget p { margin: 3px 0 0; font-size: 12.5px; color: var(--fg-2); }
.needs { border-radius: 20px; padding: 8px; display: grid; gap: 2px; }
.needs header { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 6px; }
.needs header b { font: 500 13px var(--display); letter-spacing: -0.005em; }
.needs header .n { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 999px; background: var(--clay); color: #0c0c0d; font-size: 11.5px; font-weight: 600; padding: 0 6px; }
.need { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 12px 10px; border-radius: 14px; transition: background 200ms ease; animation: fadein 500ms var(--ease) both; }
.need:hover { background: rgba(242, 241, 238, 0.04); }
.need p { margin: 0; font-size: 13.5px; line-height: 1.4; }
.need small { display: block; margin-top: 3px; font-size: 12px; color: var(--fg-3); }
.need .a { display: flex; gap: 6px; margin-top: 10px; }
.need .a button { height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; border: 1px solid rgba(242, 241, 238, 0.12); transition: background 200ms ease, border-color 200ms ease; }
.need .a button:first-child { background: var(--fg); color: #0c0c0d; border-color: var(--fg); }
.need .a button:hover { border-color: rgba(242, 241, 238, 0.28); }
.needs .none { padding: 10px; font-size: 13px; color: var(--fg-3); }

/* activity feed */
.feed { position: absolute; left: 112px; bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); width: 340px; border-radius: 20px; padding: 8px; transition: opacity 500ms var(--ease); animation: rise 1100ms var(--ease) 1400ms both; }
.feed header { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 6px; }
.feed header b { font: 500 13px var(--display); }
.feed .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--fg-3); }
.feed .live i { width: 6px; height: 6px; border-radius: 50%; background: #6fcf8e; box-shadow: 0 0 0 3px rgba(111, 207, 142, 0.15); animation: pulse 2s ease-in-out infinite; }
.ev { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 9px 10px; border-radius: 12px; animation: fadein 500ms var(--ease) both; }
.ev:hover { background: rgba(242, 241, 238, 0.04); }
.ev .x { min-width: 0; }
.ev .x span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.35; }
.ev .x small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--fg-3); }
.ev button { font-size: 12px; font-weight: 500; color: var(--fg-2); padding: 4px 8px; border-radius: 8px; opacity: 0; transition: opacity 200ms ease, background 200ms ease; }
.ev:hover button { opacity: 1; }
.ev button:hover { background: rgba(242, 241, 238, 0.08); color: var(--fg); }
.ui.focused .side, .ui.focused .feed { opacity: 0; pointer-events: none; transform: translateX(8px); }

/* waiting sheet */
.sheet { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 78px); right: max(40px, env(safe-area-inset-right, 0px)); width: min(400px, calc(100% - 32px)); background: var(--raise); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); border: 1px solid var(--line); border-radius: 18px; padding: 10px 20px; display: grid; transform-origin: top right; animation: sheet 380ms var(--ease); }
@keyframes sheet { from { opacity: 0; transform: scale(0.97) translateY(-6px); } }
.sheet .w { display: grid; gap: 10px; padding: 16px 0; border-top: 1px solid var(--line); }
.sheet .w:first-child { border-top: 0; }
.sheet .w p { margin: 0; font-size: 15px; line-height: 1.4; }
.sheet .w small { color: var(--fg-3); font-size: 12.5px; }
.sheet .w .a { display: flex; gap: 16px; }
.sheet .empty { color: var(--fg-3); padding: 16px 0; margin: 0; }

.suggest, .keys { display: none !important; }
.ui.focused .suggest, .ui.focused .keys { opacity: 0; pointer-events: none; }

@media (max-width: 820px) {
  .ui, .top, .focus { padding: 0; }
  .top { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 18px); }
  .headline { font-size: 30px; }
  .sub { font-size: 15px; }
  .when { display: none; }
  .focus { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); transform: none; gap: 16px; }
